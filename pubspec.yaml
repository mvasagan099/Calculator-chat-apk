name: calculator_messenger
description: A private messenger behind a functional calculator.
publish_to: none
version: 1.1.2+4
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  supabase_flutter: ^2.18.3
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  livekit_client: ^2.13.1
  flutter_webrtc: 1.6.2+hotfix.4
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  connectivity_plus: '>=7.0.0 <7.3.2'
  uuid: ^4.6.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  intl: 0.20.2
  video_player: ^2.14.1
  share_plus: ^13.3.1
  geolocator: ^14.1.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  flutter_image_compress: ^2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only OS SQLite loader. v3 native-asset hooks otherwise stage an unused
  # second SQLite engine in Android APKs; production uses sqflite_android.
  sqflite_common_ffi: '>=2.3.7+1 <2.4.0'
  sqlite3: ^2.9.4
flutter:
  uses-material-design: true
