name: Optimized signed Android release APKs
on:
  workflow_dispatch:
    inputs:
      acknowledge_development_only:
        description: 'I understand these internal artifacts do not certify production/provider/device release gates'
        type: boolean
        required: true
        default: false
      acknowledge_manual_trust:
        description: 'I independently reviewed this SHA and trust all repository writers; actor gates cannot protect repository secrets from writers'
        type: boolean
        required: true
        default: false
      expected_ref:
        description: 'Exact reviewed source ref (must also match the Run workflow branch selector)'
        type: string
        required: true
        default: refs/heads/codex/optimized-auth-media-release
      expected_sha:
        description: 'Independently reviewed immutable source commit: exactly 40 lowercase hex characters'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: optimized-release-${{ github.ref }}
  cancel-in-progress: false
# These checks are defense in depth, not a boundary against repository writers.
# See docs/OPTIMIZED_RELEASE_ACTIONS.md before storing repository signing secrets.
defaults:
  run:
    shell: bash
jobs:
  authorize-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      # No checkout, third-party action or repository secret before this gate.
      - name: Authorize fresh manual dispatch of independently reviewed source
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REF: ${{ inputs.expected_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACKNOWLEDGED: ${{ inputs.acknowledge_development_only }}
          ACKNOWLEDGED_TRUST: ${{ inputs.acknowledge_manual_trust }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = mvasagan099/Calculator-chat-apk
          test "$REPOSITORY_ID" = 1420812433
          # Explicit owner-only login + immutable account-ID allowlist.
          case "$ACTOR:$ACTOR_ID" in
            mvasagan099:188013739) ;;
            *) echo 'Release actor is not authorized'; exit 1 ;;
          esac
          test "$TRIGGERING_ACTOR" = "$ACTOR"
          # Re-runs inherit the original actor's privileges. Require fresh review.
          test "$RUN_ATTEMPT" = 1
          test "$ACKNOWLEDGED" = true
          test "$ACKNOWLEDGED_TRUST" = true
          test "$EXPECTED_REF" = refs/heads/codex/optimized-auth-media-release
          test "$SOURCE_REF" = "$EXPECTED_REF"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_SHA"
          test "$WORKFLOW_REF" = "$REPOSITORY/.github/workflows/android-optimized-release.yml@$EXPECTED_REF"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Manual release authorized for %s at %s. Independent owner review is required.\n' "$SOURCE_REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
  security-checks:
    needs: authorize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize-release.outputs.sha }}
          persist-credentials: false
      - name: Confirm immutable checkout
        env:
          REVIEWED_SHA: ${{ needs.authorize-release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          mkdir -p build-evidence
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preflight Python release tooling before Android builds
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/tests -p '*_test.py' 2>&1 | tee build-evidence/tooling-tests.txt
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Check database, Edge functions and native security helpers
        run: |
          mkdir -p build-evidence
          set -o pipefail
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts supabase/tests/hosted*.ts 2>&1 | tee build-evidence/edge-check.txt
          deno test --allow-env=BUF_BIGINT_DISABLE --config supabase/functions/deno.json supabase/functions/_shared/*_test.ts 2>&1 | tee build-evidence/edge-tests.txt
          node --test gateway/account-auth-worker.test.mjs 2>&1 | tee build-evidence/gateway-tests.txt
          bash scripts/test-database.sh 2>&1 | tee build-evidence/database-tests.txt
          python3 scripts/test-pin-kdf.py 2>&1 | tee build-evidence/pin-kdf.txt
          python3 scripts/test-signal-prototype.py 2>&1 | tee build-evidence/protocol-prototype.txt
      - name: Preserve security diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-release-security-${{ github.run_id }}
          path: build-evidence/*.txt
          if-no-files-found: warn
          retention-days: 7
  optimized-release:
    needs: [authorize-release, security-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            platform: android-arm64
          - abi: armeabi-v7a
            platform: android-arm
    # GitHub Free/private manual path: repository secrets, no environment.
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: source
        with:
          ref: ${{ needs.authorize-release.outputs.sha }}
          persist-credentials: false
      - name: Confirm immutable checkout
        env:
          REVIEWED_SHA: ${{ needs.authorize-release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          mkdir -p build-evidence
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: ./scripts/install-flutter-ci.sh
      - name: Prepare public connected configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          ACCOUNT_AUTH_GATEWAY_URL: ${{ vars.ACCOUNT_AUTH_GATEWAY_URL }}
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG || vars.FIREBASE_ANDROID_CONFIG }}
        run: |
          python3 scripts/prepare-client-config.py --mode connected --from-environment --output config/ci-public.json
          test -f android/app/google-services.json || { echo 'Firebase Android console configuration required'; exit 2; }
      - name: Verify locked source before accessing signing inputs
        run: |
          mkdir -p build-evidence
          set -o pipefail
          flutter doctor -v 2>&1 | tee build-evidence/doctor.txt
          flutter pub get --enforce-lockfile 2>&1 | tee build-evidence/pub-get.txt
          python3 -m unittest discover -s scripts/tests -p '*_test.py' 2>&1 | tee build-evidence/tooling-tests.txt
          flutter analyze --no-pub 2>&1 | tee build-evidence/analyze.txt
          flutter test --no-pub --reporter expanded --timeout 2m 2>&1 | tee build-evidence/flutter-tests.txt
      - name: Regenerate release plugin registration after tests
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          # Flutter #169336: --no-pub skips release-mode plugin regeneration.
          # Keep pub enabled for config-only; the final build reuses these files.
          flutter build apk --release --config-only --split-per-abi \
            --target-platform "$TARGET_PLATFORM" \
            --dart-define-from-file=config/ci-public.json 2>&1 | tee build-evidence/release-config.txt
          git diff --exit-code -- pubspec.lock
      - name: Recheck authorization and source immediately before signing
        env:
          REVIEWED_SHA: ${{ needs.authorize-release.outputs.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$ACTOR:$ACTOR_ID" = mvasagan099:188013739
          test "$TRIGGERING_ACTOR" = "$ACTOR"
          test "$RUN_ATTEMPT" = 1
          test "$REVIEWED_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git diff --quiet HEAD -- .
          printf 'Reviewed source: %s\n' "$REVIEWED_SHA" > build-evidence/source.txt
      - name: Verify and materialize owner signing configuration
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: python3 scripts/configure-release-signing.py --directory "$RUNNER_TEMP"
      - name: Build architecture-specific signed release
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          flutter build apk --release --no-pub --split-per-abi \
            --target-platform "$TARGET_PLATFORM" \
            --dart-define-from-file=config/ci-public.json 2>&1 | tee build-evidence/release-apk.txt
      - name: Remove generated private signing files
        if: always() && steps.source.outcome == 'success'
        run: python3 scripts/configure-release-signing.py --directory "$RUNNER_TEMP" --cleanup
      - name: Verify owner signature, package and known secret formats
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ABI: ${{ matrix.abi }}
        run: |
          python3 scripts/verify-apk.py "build/app/outputs/flutter-apk/app-$ABI-release.apk" \
            --android-sdk "$ANDROID_HOME" --variant release \
            --expected-cert-sha256 "$ANDROID_CERT_SHA256" --output-dir build-evidence/inspection
      - name: Measure exact bytes and enforce size and ABI gates
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 scripts/apk-size-report.py "build/app/outputs/flutter-apk/app-$ABI-release.apk" \
            --abi "$ABI" --output build-evidence/inspection/size.json
      - name: Upload verified optimized APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-release-${{ matrix.abi }}-${{ github.run_id }}
          path: |
            build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
            build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk.sha256
            build-evidence/inspection/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-release-diagnostics-${{ matrix.abi }}-${{ github.run_id }}
          path: |
            build-evidence/*.txt
            build-evidence/inspection/*.json
            build-evidence/inspection/*.txt
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Record release limitations
        if: always()
        run: echo 'Internal development artifacts only. Hosted/device/privacy/stability gates require separate evidence; this workflow does not publish an app.' >> "$GITHUB_STEP_SUMMARY"
