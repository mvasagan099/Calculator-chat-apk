name: Android PIN profile APK
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview or connected mode; provider configuration is required only for connected'
        type: choice
        options: [preview, connected]
        default: preview
      implementation:
        description: 'PBKDF2 implementation; all retain 600000 iterations for new PINs'
        type: choice
        options: [native, dart-isolate, dart-baseline, all]
        default: native
permissions:
  contents: read
concurrency:
  group: android-pin-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free unused runner disk space for Flutter native builds
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # GitHub-hosted images include large SDKs unused by this Android APK.
          # Do not remove Java, Flutter, Android platforms/build-tools or the requested NDK.
          for path in /usr/share/dotnet /usr/local/share/powershell /opt/ghc; do
            if [[ -d "$path" ]]; then sudo rm -rf -- "$path"; fi
          done
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for path in "$sdk_root/system-images" "$sdk_root/emulator"; do
            if [[ -d "$path" ]]; then sudo rm -rf -- "$path"; fi
          done
          if [[ -d "$sdk_root/ndk" ]]; then
            for path in "$sdk_root"/ndk/*; do
              [[ -e "$path" ]] || continue
              [[ "${path##*/}" == "28.2.13676358" ]] && continue
              sudo rm -rf -- "$path"
            done
          fi
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - name: Install compatible Android packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install exact official Flutter SDK
        run: ./scripts/install-flutter-ci.sh
      - name: Validate public build configuration
        id: config
        env:
          BUILD_MODE: ${{ github.event.inputs.mode || 'preview' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG || vars.FIREBASE_ANDROID_CONFIG }}
        run: |
          python3 scripts/prepare-client-config.py --mode "$BUILD_MODE" --from-environment --output config/ci-public.json
          echo "mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
      - name: Toolchain diagnostics
        run: |
          mkdir -p build-evidence
          set -o pipefail
          flutter doctor -v 2>&1 | tee build-evidence/doctor.txt
      - name: Resolve locked dependencies
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee build-evidence/pub-get.txt
      - name: Analyze and test
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p '*_test.py' 2>&1 | tee build-evidence/config-tests.txt
          flutter analyze --no-pub 2>&1 | tee build-evidence/analyze.txt
          flutter test --no-pub --reporter expanded 2>&1 | tee build-evidence/flutter-tests.txt
      - name: Check platform KDF compatibility vectors
        run: python3 scripts/test-pin-kdf.py
      - name: Build ARM64 profile APK
        env:
          PIN_KDF_IMPLEMENTATION: ${{ inputs.implementation }}
        run: |
          set -o pipefail
          echo "Disk space before Gradle:"
          df -h /
          trap 'echo "Disk space after Gradle:"; df -h /' EXIT
          case "$PIN_KDF_IMPLEMENTATION" in
            all) implementations='native dart-isolate dart-baseline' ;;
            native|dart-isolate|dart-baseline) implementations="$PIN_KDF_IMPLEMENTATION" ;;
            *) exit 2 ;;
          esac
          # All variants in one job reuse the same disposable debug signer.
          for implementation in $implementations; do
            flutter build apk --profile --target-platform android-arm64 --no-pub --dart-define-from-file=config/ci-public.json --dart-define=PIN_UNLOCK_PROFILING=true --dart-define="PIN_KDF_IMPLEMENTATION=$implementation" 2>&1 | tee "build-evidence/profile-$implementation.txt"
            output_dir="build-evidence/apk/$implementation"
            python3 scripts/verify-apk.py build/app/outputs/flutter-apk/app-profile.apk --android-sdk "$ANDROID_HOME" --variant profile --output-dir "$output_dir"
            cp build/app/outputs/flutter-apk/app-profile.apk "$output_dir/app-profile.apk"
          done
      - name: Verify comparison artifacts share one signer
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('build-evidence/apk').glob('*/artifact-inspection.json'))
          assert files, 'No inspected profile APK'
          assert len({json.loads(p.read_text())['certificate_sha256'] for p in files}) == 1, 'Comparison signer mismatch'
          PY
      - name: Upload inspected ARM64 profile APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-profile-arm64-${{ steps.config.outputs.mode }}-${{ inputs.implementation }}
          if-no-files-found: error
          retention-days: 14
          path: build-evidence/apk/
          compression-level: 0
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-profile-build-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: build-evidence/*.txt
      - name: Summarize result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          BUILD_MODE: ${{ steps.config.outputs.mode }}
        run: |
          echo "Android ARM64 profile job: $JOB_RESULT; mode: $BUILD_MODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_RESULT" = success ]; then
            echo 'A signed profile APK passed static checks. Developer-only timings are enabled; device performance and provider functionality remain unverified. Preserve installed data if the CI signing certificate differs.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK build or verification failed. Inspect the failing step and build-log artifact. No successful APK is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
