name: Android debug APK
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview uses local fixtures; connected requires public repository variables'
        type: choice
        options: [preview, connected]
        default: preview
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compatible Android packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install exact official Flutter SDK
        run: ./scripts/install-flutter-ci.sh
      - name: Validate public build configuration
        id: config
        env:
          BUILD_MODE: ${{ github.event.inputs.mode || 'preview' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_CONFIG: ${{ vars.FIREBASE_ANDROID_CONFIG }}
        run: |
          python3 scripts/prepare-client-config.py --mode "$BUILD_MODE" --from-environment --output config/ci-public.json
          echo "mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
      - name: Toolchain diagnostics
        run: |
          mkdir -p build-evidence
          set -o pipefail
          flutter doctor -v 2>&1 | tee build-evidence/doctor.txt
      - name: Resolve locked dependencies
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee build-evidence/pub-get.txt
      - name: Analyze and test
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p '*_test.py' 2>&1 | tee build-evidence/config-tests.txt
          flutter analyze --no-pub 2>&1 | tee build-evidence/analyze.txt
          flutter test --no-pub --reporter expanded 2>&1 | tee build-evidence/flutter-tests.txt
      - name: Build signed debug APK
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub --dart-define-from-file=config/ci-public.json 2>&1 | tee build-evidence/debug-build.txt
      - name: Verify artifact and signature
        run: python3 scripts/verify-apk.py build/app/outputs/flutter-apk/app-debug.apk --android-sdk "$ANDROID_HOME" --output-dir build-evidence
      - name: Upload verified installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-debug-${{ steps.config.outputs.mode }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build-evidence/app-debug.apk.sha256
            build-evidence/apk-metadata.txt
            build-evidence/apk-signature.txt
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-messenger-build-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: build-evidence/
      - name: Summarize result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          BUILD_MODE: ${{ steps.config.outputs.mode }}
        run: |
          echo "Android debug job: $JOB_RESULT; mode: $BUILD_MODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_RESULT" = success ]; then
            echo 'A signed debug APK passed static artifact verification. Device launch and provider functionality remain unverified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK build or verification failed. Inspect the failing step and build-log artifact. No successful APK is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
